<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TADS 3</title>
<link rel="stylesheet" href="style.css">
</head>
<!-- To publish a game, name it here: <body data-game="mygame.t3"> -->
<body>
  <div id="status" hidden><span id="status-left"></span><span id="status-right"></span></div>

  <main>
    <section id="start" hidden>
      <h1>TADS 3</h1>
      <p>Choose a game file (<code>.t3</code>) to play, or drop one on this page.</p>
      <p><input type="file" id="start-file" accept=".t3"></p>
      <p id="start-error" class="error"></p>
    </section>

    <section id="story" hidden>
      <div id="output"><input id="input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" hidden></div>
    </section>
  </main>


  <script src="tads3js.js"></script>
</body>
</html>
